<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>八工具任务助手</title><style>body{font:16px system-ui;max-width:1040px;margin:32px auto;padding:0 18px;background:#f5f7fa;color:#182337}textarea,input,button,select{font:inherit;padding:10px;border:1px solid #b9c5d5;border-radius:7px}textarea{box-sizing:border-box;width:100%;height:100px}button{cursor:pointer;background:#164a83;color:white;margin:8px 6px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:16px;border-radius:8px}section{margin:20px 0}#status{font-weight:600}.note{color:#56657b}</style>
<h1>八工具任务助手</h1><p class="note">模型负责提出操作，控制器执行校验并记录实际回执。本地后端为模拟环境，不会真实推送提醒。</p>
<section><label>API 访问令牌（仅本页内存保存） <input id="token" type="password" autocomplete="off"></label>
<label>实验组 <select id="profile"><option>full</option><option>state</option><option>baseline</option></select></label></section>
<textarea id="text" placeholder="例如：查询杭州明天的天气。或创建一个明确时间、时长的活动。"></textarea>
<div><button id="new">新建任务</button><button id="send">继续对话</button><button id="stop">停止后续操作</button><button id="refresh">刷新状态</button><button id="retry">重试未确认请求</button><button id="restore">恢复最近会话</button></div>
<p id="status" role="status" aria-live="polite">尚未开始</p><p id="progress" class="note"></p><p id="sid" class="note"></p>
<section><h2>回复与状态</h2><pre id="answer"></pre></section><section><h2>对话</h2><pre id="messages"></pre></section><section><h2>执行时间线</h2><pre id="timeline"></pre></section>
<script src="/web.js"></script></html>
